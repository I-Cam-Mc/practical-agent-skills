name: Test skills

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile helper scripts
        run: |
          find skills -path '*/scripts/*.py' -print0 | xargs -0 -r python3 -m py_compile
      - name: Run unit tests
        run: |
          set -eu
          for test_dir in skills/*/tests; do
            python3 -m unittest discover -s "$test_dir" -v
          done
